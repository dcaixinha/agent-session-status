[package]
name = "agent-session-status"
version = "0.1.1"
edition = "2024"
description = "Show coding-agent session status in desktop status bars"
license = "MIT"
repository = "https://github.com/dcaixinha/agent-session-status"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
notify = "8.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"
